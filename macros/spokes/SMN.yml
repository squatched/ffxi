job: SMN
name: Summoner

# Hub holds SMN job abilities. All avatars are defined here as spoke groups; the generator
# places them across sets automatically via gap-fill overflow allocation.
#
# Primary celestials (Ifrit/Titan/Leviathan/Garuda/Shiva/Ramuh): Sets 2-7 in primary book.
# Staff WS: Set 8. Carbuncle: Set 9 (last hub nav slot, Alt+9). Fenrir: Set 10.
# Overflow avatars (Diabolos, Cait Sith, Siren, Alexander, Odin, Atomos): gap-fill sets;
# see the "# Overflow allocations:" header in generated output for their addresses.
# Overflow avatars have no hub nav — navigate to them via /macro book N / /macro set M.
#
# Within each avatar spoke, pacts are ordered by endgame usefulness (high → Ctrl slots,
# low → Alt slots). At any sub-cap level, all unlocked pacts fit without overflow.
# Low-priority pacts (basic L1 physical hits, tier-II spells) are last so they naturally
# fall to Alt slots at endgame when all pacts are unlocked.

hubs:
  - name: main
    label: "SMN Hub"
    actions:
      - {name: Astral Conduit,    priority: high}
      - {name: Apogee,            priority: high}
      - {name: Elemental Siphon,  priority: high}
      - {name: Mana Cede,         priority: mid}


job: SMN
name: Summoner

# Hub holds SMN job abilities. Six primary celestial avatar groups (Sets 3-8) are spokes.
# Primary avatars (Ifrit/Titan/Leviathan/Garuda/Shiva/Ramuh): the six elemental celestials,
# most commonly used in endgame content (elemental burns, resist stacking, etc.).
# Overflow avatars in MNK book (Sets 6-9, Sets 4+10 left empty as bookend buffers):
#   Carbuncle (light), Fenrir (dark/moon), Diabolos (dark), Cait Sith (arcane),
#   Siren (wind), Atomos (arcane), Alexander (light), Odin (dark)
# Staff B included for WS (default B- cutoff passes it).
#
# Within each avatar spoke, pacts are ordered by endgame usefulness (high → Ctrl slots,
# low → Alt slots). At any sub-cap level, all unlocked pacts fit without overflow.
# Low-priority pacts (basic L1 physical hits, tier-II spells) are last so they naturally
# fall to Alt slots at endgame when all pacts are unlocked.

hubs:
  - name: main
    label: "SMN Hub"
    actions:
      - {name: Astral Conduit,    priority: high}
      - {name: Apogee,            priority: high}
      - {name: Elemental Siphon,  priority: high}
      - {name: Mana Cede,         priority: mid}

groups:
  - name: avatar_ifrit
    type: spoke
    actions:
      - {name: Ifrit,          priority: high}  # summon
      - {name: Inferno,        priority: high}  # 2-hour blood pact
      - {name: Meteor Strike,  priority: high}  # merit rage
      - {name: Flaming Crush,  priority: high}
      - {name: Fire IV,        priority: high}
      - {name: Crimson Howl,   priority: high}  # ward: ATK buff
      - {name: Inferno Howl,    priority: mid}   # ward: ATK+DEF buff (L88)
      - {name: Double Punch,    priority: mid}
      - {name: Burning Strike,  priority: mid}
      - {name: Conflag Strike,  priority: mid}   # L99 rage
      - {name: Fire II,         priority: low}
      - {name: Punch,           priority: low}

  - name: avatar_titan
    type: spoke
    actions:
      - {name: Titan,           priority: high}
      - {name: Earthen Fury,    priority: high}  # 2-hour
      - {name: Geocrush,        priority: high}  # merit
      - {name: Mountain Buster, priority: high}
      - {name: Stone IV,        priority: high}
      - {name: Earthen Ward,    priority: high}  # ward: bar-stone
      - {name: Earthen Armor,   priority: mid}   # ward: stoneskin party (L82)
      - {name: Megalith Throw,  priority: mid}
      - {name: Rock Buster,     priority: mid}
      - {name: Crag Throw,      priority: mid}   # L99 rage
      - {name: Stone II,        priority: low}
      - {name: Rock Throw,      priority: low}

  - name: avatar_leviathan
    type: spoke
    actions:
      - {name: Leviathan,    priority: high}
      - {name: Tidal Wave,   priority: high}  # 2-hour
      - {name: Grand Fall,   priority: high}  # merit
      - {name: Spinning Dive, priority: high}
      - {name: Water IV,     priority: high}
      - {name: Spring Water, priority: high}  # ward: curesong-like
      - {name: Tidal Roar,   priority: mid}   # ward: enmity down AoE
      - {name: Soothing Current, priority: mid}  # ward: regen
      - {name: Slowga,       priority: mid}   # ward: slowga

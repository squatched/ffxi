job: WHM
name: White Mage
ws_rank_cutoff: C   # include Staff C+ and Club B+ WS (default B- excludes C+)


hubs:
  - name: main
    label: "WHM Hub"
    actions:
      - {name: Stoneskin,       priority: high}
      - {name: Blink,           priority: high}
      - {name: Aquaveil,        priority: high}
      - {name: Divine Seal,     priority: high}
      - {name: Afflatus Solace, priority: high}
      - {name: Afflatus Misery, priority: mid}
      - {name: Divine Caress,   priority: mid}
      - {name: Sacrosanctity,   priority: mid}
      - {name: Asylum,          priority: mid}
      - {name: Martyr,          priority: low}
      - {name: Devotion,        priority: low}

groups:
  - name: healing
    type: core
    actions:
      - {name: Cure, priority: high}              # CureL — highest available
      - {name: Cure, priority: high, sub_tier: 1} # CureM — 1 below max
      - {name: Cure, priority: high, sub_tier: 2} # CureS — 2 below max
      - {name: Cura, priority: high}              # CuraL — highest available (Cura III at L95)
      - {name: Cura, priority: high, sub_tier: 2} # CuraS — Cura (base) at L99
      - {name: Curaga,    priority: mid}
      - {name: Full Cure, priority: mid}
      - {name: Raise,     priority: mid}          # resolves to Raise III at L99
      - {name: Arise,     priority: mid}          # WHM-only full HP/MP raise
      - {name: Regen,     priority: mid}

  - name: status_removal
    type: spoke
    actions:
      - {name: Poisona,  priority: high}
      - {name: Paralyna, priority: high}
      - {name: Blindna,  priority: high}
      - {name: Silena,   priority: high}
      - {name: Cursna,   priority: high}
      - {name: Viruna,   priority: high}
      - {name: Stona,    priority: high}
      - {name: Erase,    priority: high}
      - {name: Esuna,    priority: high}
      - {name: Sacrifice, priority: high}

  - name: offensive
    type: spoke
    # Mixed set: holy damage + CC + debuffs — all on one set per WHM.md design
    actions:
      - {name: Holy,    priority: high}
      - {name: Banish,  priority: high}
      - {name: Banishga, priority: high}
      - {name: Flash,   priority: high}
      - {name: Repose,  priority: high}
      - {name: Dia,      priority: mid}
      - {name: Slow,     priority: mid}
      - {name: Silence,  priority: mid}
      - {name: Paralyze, priority: mid}
      - {name: Diaga,    priority: mid}

  - name: enhance_others
    type: spoke
    actions:
      - {name: Haste,      priority: high}
      - {name: Regen,      priority: high} # cross-cutting: also in healing
      - {name: Auspice,    priority: high}
      - {name: Boost-STR,  priority: high}
      - {name: Boost-DEX,  priority: high}
      - {name: Boost-VIT,  priority: high}
      - {name: Boost-AGI,  priority: high}
      - {name: Boost-INT,  priority: high}
      - {name: Boost-MND,  priority: high}
      - {name: Boost-CHR,  priority: high}

  - name: resist_elem
    type: spoke
    family: resist_bars
    # Elemental resistance buffs. Order: Earth → Lightning → Water → Fire → Ice → Wind
    actions:
      - {name: Barstonra,   priority: high}
      - {name: Barthundra,  priority: high}
      - {name: Barwatera,   priority: high}
      - {name: Barfira,     priority: high}
      - {name: Barblizzara, priority: high}
      - {name: Baraera,     priority: high}

  - name: resist_status
    type: spoke
    family: resist_bars
    # Status resistance buffs.
    actions:
      - {name: Barsleepra,   priority: high}
      - {name: Barparalyzra, priority: high}
      - {name: Barsilencera, priority: high}
      - {name: Barpoisonra,  priority: high}
      - {name: Barpetra,     priority: high}
      - {name: Baramnesia,   priority: high}
      - {name: Baramnesra,   priority: high}
      - {name: Barvira,      priority: high}

  - name: resist_dmg
    type: spoke
    actions:
      - {name: Protect,    priority: high}  # series: Protect → Protect V
      - {name: Protectra,  priority: high}  # series: Protectra → Protectra V (AoE)
      - {name: Shell,      priority: high}  # series: Shell → Shell V
      - {name: Shellra,    priority: high}  # series: Shellra → Shellra V (AoE)
      - {name: Reraise,    priority: mid}   # series: Reraise → Reraise IV

  - name: field
    type: spoke
    actions:
      - {name: Sneak,           priority: high}
      - {name: Invisible,       priority: high}
      - {name: Deodorize,       priority: high}
      - {name: Teleport-Altep,  priority: mid}
      - {name: Teleport-Dem,    priority: mid}
      - {name: Teleport-Holla,  priority: mid}
      - {name: Teleport-Mea,    priority: mid}
      - {name: Teleport-Vahzl,  priority: mid}
      - {name: Teleport-Yhoat,  priority: mid}
      - {name: Recall-Jugner,   priority: low}
      - {name: Recall-Meriph,   priority: low}
      - {name: Recall-Pashh,    priority: low}

  - name: ws_club
    type: spoke
    actions:
      - {name: Hexa Strike,   priority: high}
      - {name: Black Halo,    priority: high}
      - {name: True Strike,   priority: high}
      - {name: Judgment,      priority: high}
      - {name: Flash Nova,    priority: high}
      - {name: Mystic Boon,   priority: mid}
      - {name: Shining Strike, priority: low}
      - {name: Seraph Strike, priority: low}
      - {name: Brainshaker,   priority: low}
      - {name: Starlight,     priority: low}
      - {name: Moonlight,     priority: low}
      - {name: Skullbreaker,  priority: low}

  - name: ws_staff
    type: spoke
    actions:
      - {name: Spirit Taker,  priority: high}
      - {name: Retribution,   priority: high}
      - {name: Cataclysm,     priority: high}
      - {name: Full Swing,    priority: high}
      - {name: Shell Crusher, priority: high}
      - {name: Heavy Swing,   priority: low}
      - {name: Rock Crusher,  priority: low}
      - {name: Earth Crusher, priority: low}
      - {name: Shattersoul,   priority: low}
      - {name: Starburst,     priority: low}
      - {name: Sunburst,      priority: low}

job: WAR
name: Warrior

# Excluded intentionally (weapons WAR has at low rank but won't use in practice):
exclude:
  # Staff WS — WAR has rank A+ but doesn't wield Staff in practice
  - Heavy Swing    # Staff WS
  - Rock Crusher   # Staff WS
  - Earth Crusher  # Staff WS
  - Spirit Taker   # Staff WS
  - Full Swing     # Staff WS
  - Shell Crusher  # Staff WS
  - Cataclysm      # Staff WS
  - Starburst      # Staff WS
  - Sunburst       # Staff WS
  - Shattersoul    # Staff WS
  - Retribution    # Staff WS (quest)

hubs:
  - name: offensive
    label: "Off Hub"
    actions:
      - {name: Berserk,           priority: high}
      - {name: Warcry,            priority: high}
      - {name: Aggressor,         priority: high}
      - {name: Restraint,         priority: high}
      - {name: Blood Rage,        priority: high}
      - {name: Brazen Rush,       priority: mid}
      - {name: Warrior's Charge,  priority: mid}

  - name: defensive
    label: "Def Hub"
    actions:
      - {name: Provoke,        priority: high}
      - {name: Defender,       priority: high}
      - {name: Retaliation,    priority: high}
      - {name: Tomahawk,       priority: high}
      - {name: Ranged Attack,  priority: mid}


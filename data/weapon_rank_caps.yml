# Canonical weapon skill rank cap tables for FFXI
#
# IMPORTANT: Wiki job pages (bg-wiki.com/ffxi/Skill_Caps/Job_Name) use inconsistent rank
# labels. The same letter grade (e.g. "B") can refer to different cap tables on different
# job pages. These canonical tier names are defined by their cap at level 75 and
# cross-verified across multiple job pages. Always confirm a job's tier by matching
# cap values, not letter labels.
#
# Canonical tiers by L75 cap value:
#   A+: 276  |  A: 269  |  B+: 256  |  B: 250  |  B-: 240
#   C+: 230  |  C-: 220  |  D: 210  |  E: 200
#
#
# Usage: caps is a 99-element array; caps[level - 1] = max skill cap at that level.
#   Example: caps[74] = cap at level 75.
#
# Source: bg-wiki.com/ffxi/Skill_Caps pages, cross-verified across multiple jobs per tier.

